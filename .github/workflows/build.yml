name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilation directe Android
        run: |
          npx @capacitor/cli create android-app --appName "LES JAMBARES" --appId sn.armee.lesjambares --web-dir www --template @capacitor/assets || true
          # Si le dossier web n'est pas au bon endroit, on le copie directement
          mkdir -p android-app/android/app/src/main/assets/public
          cp -r www/* android-app/android/app/src/main/assets/public/
          cd android-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
